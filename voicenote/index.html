<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Voice Note</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,700&display=swap" rel="stylesheet">
<style>
  :root {
    --ground:#ECEFF6; --surface:#FFFFFF; --ink:#151A33; --muted:#5E6785; --line:#D9DEEB;
    --accent:#3A3FE0; --you:#3A3FE0; --marigold:#F0A020; --rec:#E5484D; --rec-ink:#C2262B;
    --idle-bar:#C7CDE0; --bot-bar-idle:#D7DBEA; --shadow:0 12px 32px -14px rgba(21,26,51,.35);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --ground:#0D0F1E; --surface:#171A30; --ink:#ECEEF8; --muted:#9AA2C0; --line:#262A45;
      --accent:#7D83FF; --you:#4A50F0; --marigold:#FFB547; --rec:#FF6369; --rec-ink:#FF8A8F;
      --idle-bar:#323757; --bot-bar-idle:#33385A; --shadow:0 12px 32px -14px rgba(0,0,0,.7);
    }
  }
  * { box-sizing:border-box; }
  html, body { height:100%; }
  body {
    margin:0; background:var(--ground); color:var(--ink);
    font:16px/1.5 "Bricolage Grotesque", system-ui, -apple-system, "Segoe UI", sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .app {
    max-width:720px; margin:0 auto; height:100dvh; padding:0 16px;
    display:grid; grid-template-rows:auto 1fr auto;
  }

  /* header */
  header { display:flex; align-items:center; justify-content:space-between; gap:12px; padding:20px 0 12px; }
  .brand { display:flex; align-items:center; gap:12px; min-width:0; }
  .brand svg { flex:none; }
  h1 { margin:0; font-size:1.3rem; line-height:1.1; font-weight:700; letter-spacing:-.015em; }
  .tagline { margin:2px 0 0; color:var(--muted); font-size:.9rem; }
  .ghost {
    font:inherit; font-size:.85rem; background:none; color:var(--muted); cursor:pointer;
    border:1px solid var(--line); border-radius:999px; padding:6px 14px;
    white-space:nowrap; flex:none;
  }
  .ghost:hover { color:var(--ink); border-color:var(--muted); }
  .ghost[hidden] { display:none; }

  /* conversation */
  main { overflow-y:auto; display:flex; flex-direction:column; gap:14px; padding:8px 2px 20px; }
  .empty { margin:auto; text-align:center; max-width:30ch; color:var(--muted); }
  .empty strong { display:block; color:var(--ink); font-size:1.35rem; line-height:1.25; letter-spacing:-.01em; margin-bottom:8px; }
  .empty span { font-size:.95rem; }

  .bubble { max-width:min(88%, 470px); padding:12px 14px 12px 12px; border-radius:22px; display:flex; flex-direction:column; gap:8px; animation:rise .18s ease-out; }
  .bubble.you { align-self:flex-end; background:var(--you); color:#fff; border-bottom-right-radius:6px; }
  .bubble.bot { align-self:flex-start; background:var(--surface); border:1px solid var(--line); border-bottom-left-radius:6px; }
  .voice { display:flex; align-items:center; gap:10px; }
  .play {
    flex:none; width:38px; height:38px; border:0; border-radius:50%; cursor:pointer;
    display:grid; place-items:center;
  }
  .you .play { background:#fff; color:var(--you); }
  .bot .play { background:var(--marigold); color:#1c1500; }
  .wave { flex:1; min-width:130px; height:32px; display:flex; align-items:center; gap:3px; }
  .wave i { flex:1; min-width:2px; border-radius:2px; transition:background .12s; }
  .you .wave i { background:rgba(255,255,255,.4); }
  .you .wave i.on { background:#fff; }
  .bot .wave i { background:var(--bot-bar-idle); }
  .bot .wave i.on { background:var(--marigold); }
  .time { font-size:.78rem; font-variant-numeric:tabular-nums; opacity:.85; min-width:2.7em; text-align:right; }
  .text { margin:0; padding:0 4px; }
  .pending .text { animation:blink 1.1s ease-in-out infinite; opacity:.85; }
  .meta { margin:0; padding:2px 4px 0; font-size:.78rem; line-height:1.45; color:var(--muted); border-top:1px solid var(--line); padding-top:8px; }

  /* dock */
  footer { padding:8px 0 max(16px, env(safe-area-inset-bottom)); }
  .dock {
    background:var(--surface); border:1px solid var(--line); border-radius:30px; box-shadow:var(--shadow);
    padding:14px 14px 14px 22px; display:grid; grid-template-columns:1fr auto; align-items:center; gap:16px;
  }
  .meter { min-width:0; }
  #live { display:block; width:100%; height:48px; }
  .limit { height:3px; margin-top:6px; border-radius:2px; background:var(--line); overflow:hidden; opacity:0; transition:opacity .2s; }
  .limit i { display:block; height:100%; background:var(--rec); transform-origin:left; transform:scaleX(0); }
  body[data-state="recording"] .limit { opacity:1; }
  #status { margin:8px 0 0; font-size:.9rem; color:var(--muted); min-height:1.4em; }
  #status.err { color:var(--rec-ink); }
  body[data-state="recording"] #status { color:var(--ink); }

  .mic {
    position:relative; width:70px; height:70px; border:0; border-radius:50%; cursor:pointer;
    background:var(--accent); color:#fff; display:grid; place-items:center;
    transition:transform .15s, background .2s;
  }
  .mic:active { transform:scale(.95); }
  .mic:disabled { opacity:.55; cursor:progress; }
  body[data-state="recording"] .mic { background:var(--rec); }
  .mic::after { content:""; position:absolute; inset:-6px; border-radius:50%; border:2px solid var(--rec); opacity:0; pointer-events:none; }
  body[data-state="recording"] .mic::after { animation:pulse 1.4s ease-out infinite; }
  button:focus-visible { outline:3px solid var(--marigold); outline-offset:3px; }
  kbd { font:inherit; font-size:.8rem; border:1px solid var(--line); border-radius:6px; padding:0 6px; }

  @keyframes pulse { 0% { transform:scale(.92); opacity:.7; } 100% { transform:scale(1.4); opacity:0; } }
  @keyframes rise { from { opacity:0; transform:translateY(6px); } to { opacity:1; transform:none; } }
  @keyframes blink { 50% { opacity:.45; } }
  @media (prefers-reduced-motion: reduce) {
    .bubble, .pending .text, body[data-state="recording"] .mic::after { animation:none; }
    .mic, .wave i, .limit { transition:none; }
  }
  @media (max-width:480px) {
    .dock { padding:12px 12px 12px 16px; gap:12px; }
    .mic { width:64px; height:64px; }
    .bubble { max-width:92%; }
    .wave { min-width:90px; }
  }
</style>
</head>
<body data-state="idle">
<div class="app">
  <header>
    <div class="brand">
      <svg width="30" height="30" viewBox="0 0 30 30" aria-hidden="true">
        <rect x="3" y="11" width="4.5" height="8" rx="2.25" style="fill:var(--accent)"/>
        <rect x="10" y="5" width="4.5" height="20" rx="2.25" style="fill:var(--accent)"/>
        <rect x="17" y="9" width="4.5" height="12" rx="2.25" style="fill:var(--marigold)"/>
        <rect x="24" y="12.5" width="3.5" height="5" rx="1.75" style="fill:var(--marigold)"/>
      </svg>
      <div>
        <h1>Voice Note</h1>
        <p class="tagline">Sarvam hears and speaks. Groq thinks.</p>
      </div>
    </div>
    <button class="ghost" id="clear" type="button" hidden>Clear chat</button>
  </header>

  <main id="chat" aria-live="polite">
    <div class="empty" id="empty">
      <strong>Ask a question out loud.</strong>
      <span>Press the mic, speak for up to 25 seconds, and press it again to send.</span>
    </div>
  </main>

  <footer>
    <div class="dock">
      <div class="meter">
        <canvas id="live" aria-hidden="true"></canvas>
        <div class="limit" aria-hidden="true"><i id="limitFill"></i></div>
        <p id="status" role="status">Ready. Tap the mic or press <kbd>Space</kbd>.</p>
      </div>
      <button class="mic" id="mic" type="button" aria-label="Start recording"></button>
    </div>
  </footer>
</div>

<script>
const MAX_SECONDS = 25;       // Sarvam REST STT accepts up to 30 s per request
const TARGET_RATE = 16000;    // 16 kHz mono WAV for speech-to-text
const BARS = 36;              // bars drawn in each voice-note bubble
const READY = "Ready. Tap the mic or press Space.";

const $ = id => document.getElementById(id);
const chat = $("chat"), micBtn = $("mic"), statusEl = $("status"), clearBtn = $("clear");
const canvas = $("live"), limitFill = $("limitFill");
const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;

const ICON_MIC = '<svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="3" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>';
const ICON_STOP = '<svg width="26" height="26" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="6" y="6" width="12" height="12" rx="2.5"/></svg>';
const ICON_PLAY = '<svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5.5v13a1 1 0 0 0 1.5.86l10.5-6.5a1 1 0 0 0 0-1.72L9.5 4.64A1 1 0 0 0 8 5.5z"/></svg>';
const ICON_PAUSE = '<svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="6" y="5" width="4.5" height="14" rx="1.5"/><rect x="13.5" y="5" width="4.5" height="14" rx="1.5"/></svg>';

const sessionId = crypto.randomUUID();
let history = [];              // [{role, content}] text only, sent to the server each turn
let state = "idle";            // idle | recording | processing | speaking
let ctx, stream, source, processor, chunks = [], levels = [];
let startedAt = 0, stopTimer = null, tickTimer = null;
let currentPlayer = null;

/* ---------- state ---------- */
function setState(next, text, isErr = false) {
  state = next;
  document.body.dataset.state = next;
  statusEl.textContent = text;
  statusEl.classList.toggle("err", isErr);
  statusEl.setAttribute("role", isErr ? "alert" : "status");
  micBtn.innerHTML = next === "recording" ? ICON_STOP : ICON_MIC;
  micBtn.setAttribute("aria-label", next === "recording" ? "Stop and send" : "Start recording");
  micBtn.disabled = next === "processing";
}
const fmt = s => isFinite(s) && s > 0 ? Math.floor(s / 60) + ":" + String(Math.floor(s % 60)).padStart(2, "0") : "0:00";

function friendlyError(msg) {
  msg = String(msg || "Something went wrong.");
  if (/insufficient_quota|No credits/i.test(msg)) return "Sarvam credits have run out. Check your Sarvam account and try again.";
  if (/422|couldn't hear anything|recording is too short|too short/i.test(msg)) return "I couldn't hear that clearly. Please speak a little louder and try again.";
  if (/502|speech-to-text failed|text-to-speech failed|LLM failed/i.test(msg)) return "The voice service had a temporary problem. Please try again.";
  return msg.length > 140 ? msg.slice(0, 140) + "…" : msg;
}

/* ---------- live meter (canvas) ---------- */
function drawMeter(t) {
  const dpr = window.devicePixelRatio || 1;
  const w = canvas.clientWidth, h = canvas.clientHeight;
  if (canvas.width !== Math.round(w * dpr) || canvas.height !== Math.round(h * dpr)) {
    canvas.width = Math.round(w * dpr); canvas.height = Math.round(h * dpr);
  }
  const g = canvas.getContext("2d");
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  g.clearRect(0, 0, w, h);
  const css = getComputedStyle(document.documentElement);
  const colRec = css.getPropertyValue("--rec").trim();
  const colAccent = css.getPropertyValue("--accent").trim();
  const colIdle = css.getPropertyValue("--idle-bar").trim();
  const bar = 3, gap = 4, n = Math.max(1, Math.floor((w + gap) / (bar + gap)));
  for (let i = 0; i < n; i++) {
    let amp = 0.07, color = colIdle;
    if (state === "recording") {
      const idx = levels.length - n + i;
      amp = idx >= 0 ? Math.max(0.07, levels[idx]) : 0.07;
      color = idx >= 0 ? colRec : colIdle;
    } else if (state === "processing") {
      amp = reduceMotion ? 0.12 : 0.08 + 0.55 * Math.pow((Math.sin(t / 240 - i * 0.32) + 1) / 2, 3);
      color = colAccent;
    }
    const bh = Math.max(3, amp * h), x = i * (bar + gap), y = (h - bh) / 2;
    g.fillStyle = color;
    g.beginPath();
    if (g.roundRect) g.roundRect(x, y, bar, bh, 1.5); else g.rect(x, y, bar, bh);
    g.fill();
  }
}
(function loop(t) { if (!document.hidden) drawMeter(t); requestAnimationFrame(loop); })(0);

/* ---------- audio helpers ---------- */
function encodeWav(samples, inRate) {
  const ratio = inRate / TARGET_RATE;
  const outLen = Math.floor(samples.length / ratio);
  const pcm = new Int16Array(outLen);
  for (let i = 0; i < outLen; i++) {
    const s = Math.max(-1, Math.min(1, samples[Math.floor(i * ratio)]));
    pcm[i] = s < 0 ? s * 0x8000 : s * 0x7fff;
  }
  const buf = new ArrayBuffer(44 + pcm.length * 2);
  const v = new DataView(buf);
  const w = (o, s) => [...s].forEach((c, i) => v.setUint8(o + i, c.charCodeAt(0)));
  w(0, "RIFF"); v.setUint32(4, 36 + pcm.length * 2, true); w(8, "WAVE"); w(12, "fmt ");
  v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
  v.setUint32(24, TARGET_RATE, true); v.setUint32(28, TARGET_RATE * 2, true);
  v.setUint16(32, 2, true); v.setUint16(34, 16, true); w(36, "data");
  v.setUint32(40, pcm.length * 2, true);
  new Int16Array(buf, 44).set(pcm);
  return new Blob([buf], { type: "audio/wav" });
}

function peaksFrom(samples, n) {
  const size = Math.max(1, Math.floor(samples.length / n)), out = [];
  let max = 0;
  for (let i = 0; i < n; i++) {
    let m = 0;
    const s = i * size, e = Math.min(samples.length, s + size);
    for (let j = s; j < e; j++) { const a = Math.abs(samples[j]); if (a > m) m = a; }
    out.push(m); if (m > max) max = m;
  }
  return out.map(v => max ? Math.max(0.1, Math.pow(v / max, 0.7)) : 0.1);
}

async function decodeReply(b64) {
  const bin = atob(b64), bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  const url = URL.createObjectURL(new Blob([bytes], { type: "audio/wav" }));
  try {
    const ac = new (window.AudioContext || window.webkitAudioContext)();
    const buf = await ac.decodeAudioData(bytes.buffer.slice(0));
    ac.close();
    return { url, duration: buf.duration, peaks: peaksFrom(buf.getChannelData(0), BARS) };
  } catch (e) {
    return { url, duration: 0, peaks: Array.from({ length: BARS }, (_, i) => 0.25 + 0.5 * Math.abs(Math.sin(i * 0.9))) };
  }
}

/* ---------- empty state ---------- */
function showEmpty() {
  chat.innerHTML = '<div class="empty" id="empty"><strong>Ask a question out loud.</strong><span>Press the mic, speak for up to 25 seconds, and press it again to send.</span></div>';
  clearBtn.hidden = true;
}

/* ---------- voice-note bubbles ---------- */
function addBubble(role, { peaks, duration, url, text, pending = false, meta = "" }) {
  const empty = $("empty");
  if (empty) empty.remove();
  clearBtn.hidden = false;

  const el = document.createElement("article");
  el.className = "bubble " + role + (pending ? " pending" : "");
  const row = document.createElement("div"); row.className = "voice";
  const btn = document.createElement("button");
  btn.type = "button"; btn.className = "play"; btn.innerHTML = ICON_PLAY;
  btn.setAttribute("aria-label", "Play voice note");
  const wave = document.createElement("div"); wave.className = "wave"; wave.setAttribute("aria-hidden", "true");
  const bars = peaks.map(p => { const b = document.createElement("i"); b.style.height = Math.round(16 + p * 84) + "%"; wave.appendChild(b); return b; });
  const time = document.createElement("span"); time.className = "time"; time.textContent = fmt(duration);
  row.append(btn, wave, time);
  const p = document.createElement("p"); p.className = "text"; p.textContent = text;
  el.append(row, p);
  if (meta) {
    const m = document.createElement("p"); m.className = "meta"; m.textContent = meta;
    el.append(m);
  }
  chat.appendChild(el);
  chat.scrollTo({ top: chat.scrollHeight, behavior: reduceMotion ? "auto" : "smooth" });

  let audio = null;
  const api = {
    el, setText(t) { p.textContent = t; el.classList.remove("pending"); },
    paint(frac) { const k = Math.floor(frac * bars.length); bars.forEach((b, i) => b.classList.toggle("on", i < k)); },
    resetUi() {
      btn.innerHTML = ICON_PLAY; btn.setAttribute("aria-label", "Play voice note");
      time.textContent = fmt(duration);
      if (state === "speaking") setState("idle", READY);
    },
    async play() {
      if (currentPlayer && currentPlayer !== api) currentPlayer.stop();
      if (!audio) {
        audio = new Audio(url);
        audio.addEventListener("loadedmetadata", () => { if (!duration) { duration = audio.duration; time.textContent = fmt(duration); } });
        audio.addEventListener("timeupdate", () => {
          const d = audio.duration || duration || 1;
          api.paint(audio.currentTime / d);
          time.textContent = fmt(Math.max(0, d - audio.currentTime));
        });
        audio.addEventListener("ended", () => { api.paint(0); api.resetUi(); currentPlayer = null; });
      }
      currentPlayer = api;
      await audio.play();
      btn.innerHTML = ICON_PAUSE; btn.setAttribute("aria-label", "Pause voice note");
      if (role === "bot" && state === "idle") setState("speaking", "Speaking…");
    },
    pause() { if (audio) audio.pause(); api.resetUi(); },
    stop() { if (audio) { audio.pause(); audio.currentTime = 0; } api.paint(0); api.resetUi(); if (currentPlayer === api) currentPlayer = null; },
  };
  btn.addEventListener("click", () => { (audio && !audio.paused) ? api.pause() : api.play().catch(() => {}); });
  return api;
}

/* ---------- recording ---------- */
function teardownAudio() {
  clearTimeout(stopTimer); clearInterval(tickTimer);
  try { processor.disconnect(); source.disconnect(); } catch (e) {}
  if (stream) stream.getTracks().forEach(t => t.stop());
  limitFill.style.transform = "scaleX(0)";
}

async function startRecording() {
  if (currentPlayer) currentPlayer.stop();
  try {
    stream = await navigator.mediaDevices.getUserMedia({ audio: true });
  } catch (e) {
    setState("idle", "Microphone access is blocked. Allow it in the address bar and try again.", true);
    return;
  }
  ctx = new (window.AudioContext || window.webkitAudioContext)();
  source = ctx.createMediaStreamSource(stream);
  processor = ctx.createScriptProcessor(4096, 1, 1);
  chunks = []; levels = [];
  processor.onaudioprocess = e => {
    const data = new Float32Array(e.inputBuffer.getChannelData(0));
    chunks.push(data);
    const half = data.length >> 1;
    for (const [a, b] of [[0, half], [half, data.length]]) {
      let sum = 0; for (let i = a; i < b; i++) sum += data[i] * data[i];
      levels.push(Math.min(1, Math.sqrt(sum / (b - a)) * 7));
    }
    if (levels.length > 600) levels.splice(0, levels.length - 600);
  };
  source.connect(processor);
  processor.connect(ctx.destination);
  startedAt = performance.now();
  setState("recording", "Listening… " + MAX_SECONDS + "s left");
  tickTimer = setInterval(() => {
    const el = (performance.now() - startedAt) / 1000;
    limitFill.style.transform = "scaleX(" + Math.min(1, el / MAX_SECONDS) + ")";
    if (state === "recording") statusEl.textContent = "Listening… " + Math.max(0, Math.ceil(MAX_SECONDS - el)) + "s left";
  }, 200);
  stopTimer = setTimeout(stopRecording, MAX_SECONDS * 1000);
}

function cancelRecording() {
  if (state !== "recording") return;
  teardownAudio(); ctx.close();
  setState("idle", READY);
}

async function stopRecording() {
  if (state !== "recording") return;
  teardownAudio();
  const rate = ctx.sampleRate;
  await ctx.close();
  const total = chunks.reduce((n, c) => n + c.length, 0);
  if (total / rate < 0.4) { setState("idle", "That was too short. Hold on a little longer and try again.", true); return; }
  const samples = new Float32Array(total);
  let off = 0; for (const c of chunks) { samples.set(c, off); off += c.length; }

  // Avoid sending silent recordings to the API (a common cause of 422 errors).
  let peak = 0, sumSquares = 0;
  for (const sample of samples) {
    const value = Math.abs(sample);
    if (value > peak) peak = value;
    sumSquares += sample * sample;
  }
  const rms = Math.sqrt(sumSquares / Math.max(1, samples.length));
  if (peak < 0.008 || rms < 0.0015) {
    setState("idle", "I couldn't hear you. Check your mic and speak a little louder.", true);
    return;
  }

  const wav = encodeWav(samples, rate);
  const mine = addBubble("you", {
    peaks: peaksFrom(samples, BARS), duration: total / rate,
    url: URL.createObjectURL(wav), text: "Transcribing…", pending: true,
  });
  await sendAudio(wav, mine);
}

// "4:42:10 PM. Answered in 3.4 s: speech-to-text 0.8, LLM 1.1, text-to-speech 1.5 (browser round trip 3.6 s)."
function metaLine(m, roundTrip) {
  if (!m || !m.latency_seconds) return "";
  const l = m.latency_seconds, s = v => (typeof v === "number" ? v.toFixed(1) : "?");
  return m.date + ", " + m.time + ". Answered in " + s(l.total) + " s: speech-to-text " + s(l.speech_to_text) +
         ", LLM " + s(l.llm) + ", text-to-speech " + s(l.text_to_speech) +
         " (browser round trip " + roundTrip.toFixed(1) + " s).";
}

async function sendAudio(wav, mine) {
  const sentAt = performance.now();      // client-side latency: Stop dabane se jawab aane tak
  setState("processing", "Thinking…");
  const form = new FormData();
  form.append("audio", wav, "audio.wav");
  form.append("history", JSON.stringify(history));
  form.append("session_id", sessionId);
  try {
    const res = await fetch("/api/voice", { method: "POST", body: form });
    let data = {};
    try { data = await res.json(); } catch (e) {}
    if (!res.ok) throw new Error(data.detail || "The server returned an error (" + res.status + ").");
    const roundTrip = (performance.now() - sentAt) / 1000;
    mine.setText(data.transcript);
    history.push({ role: "user", content: data.transcript }, { role: "assistant", content: data.reply });
    const reply = await decodeReply(data.audio_base64);
    const bot = addBubble("bot", { peaks: reply.peaks, duration: reply.duration, url: reply.url, text: data.reply,
                                   meta: metaLine(data.metadata, roundTrip) });
    setState("idle", READY);
    try { await bot.play(); } catch (e) { setState("idle", "Press play to hear the answer."); }
  } catch (e) {
    mine.el.remove();
    if (!chat.querySelector(".bubble")) showEmpty();
    setState("idle", friendlyError(e.message), true);
  }
}

/* ---------- controls ---------- */
function toggleRecording() {
  if (state === "recording") stopRecording();
  else if (state === "idle" || state === "speaking") startRecording();
}
micBtn.addEventListener("click", toggleRecording);
clearBtn.addEventListener("click", () => {
  if (currentPlayer) currentPlayer.stop();
  history = [];
  const resetForm = new FormData();
  resetForm.append("session_id", sessionId);
  fetch("/api/session/reset", { method: "POST", body: resetForm }).catch(console.error);
  showEmpty();
  setState("idle", READY);
});
document.addEventListener("keydown", e => {
  if (e.code === "Space" && !e.target.closest("button, a, input, textarea")) { e.preventDefault(); toggleRecording(); }
  if (e.code === "Escape") cancelRecording();
});
setState("idle", READY);
</script>
